[project]
name = "mtls-server"
version = "0.1.0"
description = "Minimal Python mTLS server with health endpoint"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.11"
